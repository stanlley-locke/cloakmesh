[package]
name = "cloak-admin"
version = "0.1.0"
description = "CloakMesh Admin Dashboard & Browser"
authors = ["CloakMesh Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
tonic-build = "0.11"

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
cloakmesh-core = { path = "../../core" }
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4"
hex = "0.4"
reqwest = { version = "0.11", features = ["socks", "blocking"] }

[features]
# default enables decompression support in tauri
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
