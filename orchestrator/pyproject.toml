[tool.poetry]
name = "cloakmesh-orchestrator"
version = "0.1.0"
description = "CloakMesh CLI & node orchestration"
authors = ["CloakMesh Contributors"]
license = "Apache-2.0"
packages = [
    { include = "cloakcli", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
grpcio = "^1.60"
grpcio-tools = "^1.60"
typer = { version = "^0.9", extras = ["all"] }
rich = "^13.7"
pydantic = "^2.5"
toml = "^0.10"

[tool.poetry.dev-dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
ruff = "^0.1"
mypy = "^1.7"

[tool.poetry.scripts]
cloakcli = "cloakcli.main:cli"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
