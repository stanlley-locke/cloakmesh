[package]
name = "cloakmesh-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cloakmesh"
path = "src/main.rs"

[lib]
name = "cloakmesh_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-stream = "0.1"

# gRPC / protobuf
tonic = { workspace = true }
prost = { workspace = true }
prost-types = "0.12"

# Serialization
serde = { workspace = true }
serde_json = "1.0"
toml = "0.8"

# Cryptography — Ed25519 identity
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
# X25519 ECDH
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
# ChaCha20-Poly1305 AEAD
chacha20poly1305 = "0.10"
# BLAKE2 for Noise KDF
blake2 = "0.10"
# SHA-256 for address checksum & Merkle
sha2 = "0.10"
# HMAC for key derivation
hmac = "0.12"
# Constant-time comparison
subtle = "2.5"
# Secure memory zeroing
zeroize = { version = "1.7", features = ["derive"] }
# Randomness
rand = "0.8"
rand_core = "0.6"

# Encoding
base32 = "0.4"
base64 = "0.21"
hex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = { workspace = true }

# Logging / tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# IDs
uuid = { version = "1.6", features = ["v4"] }

# Async traits
async-trait = "0.1"
async-stream = "0.3"

# Metrics
prometheus = "0.13"

# Collections
indexmap = "2.0"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.4"
tempfile = "3.8"
